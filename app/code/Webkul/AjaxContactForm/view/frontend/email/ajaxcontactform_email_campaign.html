}

<!--@styles
body,td { color:#2f2f2f; font:11px/1.35em Verdana, Arial, Helvetica, sans-serif; }
@-->

<body style="background:#F6F6F6; font-family:Verdana, Arial, Helvetica, sans-serif; font-size:12px; margin:0; padding:0;">
<div style="background:#F6F6F6; font-family:Verdana, Arial, Helvetica, sans-serif; font-size:12px; margin:0; padding:0;">
    <table cellspacing="0" cellpadding="0" border="0" height="100%" width="100%">
        <tr>
            <td align="center" valign="top" style="padding:20px 0 20px 0;">
                <table bgcolor="#FFFFFF" cellspacing="0" cellpadding="10" border="0" width="650" style="border:1px solid #E0E0E0;">
                    <!-- Header -->
                    <tr>
                        <td valign="top">
                            <a href="{{store url=""}}" style="text-decoration:none;">
                            <img
                                    src="{{var logo_url}}"
                                    alt="{{var logo_alt}}"
                                    border="0"
                                    {{if logo_width}} width="{{var logo_width}}" {{else}} width="180" {{/if}}
                            {{if logo_height}} height="{{var logo_height}}" {{/if}}
                            />
                            </a>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td valign="top">
                            <h1 style="font-size:22px; font-weight:normal; line-height:22px; margin:0 0 11px 0;">{{trans "I want to be called"}}</h1>
                            <p style="margin: 0 0 5px 0;"><strong>{{trans "Name"}}:</strong> {{var name}}</p>
                            <p style="margin: 0 0 5px 0;"><strong>{{trans "Email"}}:</strong> {{var email}}</p>
                            <p style="margin: 0 0 5px 0;"><strong>{{trans "Phone"}}:</strong> {{var phone}}</p>
                            <p style="margin: 0 0 5px 0;"><strong>{{trans "Store"}}:</strong> {{var fromstore|raw}}</p>
                            <p style="margin: 0;"><strong>{{trans "Comment"}}:</strong><br/>{{var message|raw}}</p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td bgcolor="#EAEAEA" align="center" style="background:#EAEAEA; text-align:center;">
                            <p style="font-size:12px; margin:0;">
                                {{trans "Thank you"}}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
</body>
