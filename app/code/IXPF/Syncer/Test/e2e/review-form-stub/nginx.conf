#
# Local stand-in for the review form's public edge.
#
# Production puts two hops in front of the review application:
#
#   review-stage.carpetavenue.com   (Cloudflare DNS)
#     -> GCP load balancer
#       -> ixpf-ng-stage.elastycloud.net   (the ixpf-ng Go app)
#
# The customer-facing hostname is never the application's hostname. This container is that edge
# locally, so the local setup has the same shape rather than pointing Magento straight at the
# app:
#
#   https://review-m246.carpetavenue.devs:8443   (this nginx, TLS)
#     -> http://host.docker.internal:8091        (ixpf-ng, `air` / `go run ./cmd`)
#
# Proxying to 8091 rather than the Vite dev server on 3000: Vite binds [::1] only, so a
# container cannot reach it, and /r/* is rendered by Go anyway - Vite only proxies it through.
#
# Run:  docker compose up -d review-stub      (service definition in this folder's README)
# Cert: mkcert -cert-file ssl/review-stub.crt -key-file ssl/review-stub.key \
#            localhost review-m246.carpetavenue.devs 127.0.0.1
#

server {
    listen 443 ssl;
    http2 on;

    # localhost is served here too and is deliberately NOT in the app's ReviewFrameAncestors, so
    # https://localhost:8443/hostile.html is a non-allowed parent for the deny test.
    server_name review-m246.carpetavenue.devs localhost;

    # Not ssl/localhost.crt - that one is expired, and Chrome's interstitial looks exactly like
    # a framing refusal, which is an afternoon lost to the wrong problem.
    ssl_certificate     /etc/nginx/ssl/review-stub.crt;
    ssl_certificate_key /etc/nginx/ssl/review-stub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # Photo uploads go straight to GCS via signed URLs, but the form still posts inline files.
    client_max_body_size 32m;

    location /r/ {
        proxy_pass http://host.docker.internal:8091;

        # The app compares Origin against Host in its same-origin check for clients that do not
        # send Sec-Fetch-Site, so Host must stay the customer-facing name, not the upstream's.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Nothing is cached or buffered: the form is per-token and the pages are small.
        proxy_buffering off;

        # The framing headers come from the application, never from here. A second
        # Content-Security-Policy header would be enforced as the intersection of the two, so an
        # edge can only ever tighten the policy - it cannot grant framing the app refused. If
        # the iframe is blocked, fix ReviewFrameAncestors in the app's config, not this file.
    }

    # The deny-path harness. Static, and deliberately outside /r/.
    location = /hostile.html {
        add_header Cache-Control "no-store" always;
    }
}
