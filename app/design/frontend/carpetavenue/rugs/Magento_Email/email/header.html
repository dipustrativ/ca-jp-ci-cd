<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="initial-scale=1.0, width=device-width" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <style type="text/css">
        a {color: #575757;}
        .unsubscribe a,
        .unsubscribe a:visited {
            text-decoration: underline !important;
            color: #ffffff !important;
        }
    </style>
    <style type="text/css">
        {{var template_styles|raw}}

        {{css file="css/email.css"}}
    </style>
</head>
<body>
{{inlinecss file="css/email-inline.css"}}

<!-- Begin wrapper table -->
<table class="wrapper" style="width: 660px">
    <tr>
        <td class="wrapper-inner" align="center">
            <table class="main" align="center">
                <tr>
                    <td class="header" style="padding: 25px 0 25px 0; text-align: center">
                        <a class="logo" href="{{store url=''}}">
                            <img
                                {{if logo_width}}
                                    width="{{var logo_width}}"
                                {{else}}
                                    width="180"
                                {{/if}}

                                {{if logo_height}}
                                    height="{{var logo_height}}"
                                {{/if}}

                                src="{{var logo_url}}"
                                alt="{{var logo_alt}}"
                                border="0"
                            />
                        </a>
                    </td>
                </tr>
                <tr>
                    <table style="width:660px; text-align: center; font-size: 16px;" align="center">
                        <tr>
                            <!-- Menu items -->
                            <td style="width: 10%;">
                                &nbsp;
                            </td>
                            <td style="width: 20%; padding: 0;">
                                <a href="{{store direct_url='all-carpets/oriental-carpets'}}" style="color:#333333;">{{trans 'Oriental Carpets'}}</a>
                            </td>
                            <td style="width: 20%; padding: 0;">
                                <a href="{{store direct_url='all-carpets/modern-carpets'}}" style="color:#333333;">{{trans 'Modern Carpets'}}</a>
                            </td>
                            <td style="width: 20%; padding: 0;">
                                <a href="{{store direct_url='all-carpets/sale'}}" style="color:#2b8d3a;">{{trans 'Sale'}}</a>
                            </td>
                            <td style="width: 10%;">
                                &nbsp;
                            </td>
                        </tr>
                    </table>
                </tr>
                <tr>
                    <td class="main-content">
                    <!-- Begin Content -->
