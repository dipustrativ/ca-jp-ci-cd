name: build-deploy

# Push to main -> build the Magento image on our build server (self-hosted runner)
# -> push to the registry -> tell Dokploy (hosting server) to repull + restart.
# Tags pushed (same image, both):
#   latest      what Dokploy pulls by default
#   v<run>      frozen version, never moves -> rollback target
# Setup: docker/INFRA-CI.md, Part 2 (CI/CD).

# ⚠️ NO self-hosted runner is registered for indexon/carpetavenue-jp yet, so the
# push trigger is OFF — with it on, every push to main would queue a job forever
# waiting for a `carpetavenue-jp-build` runner that does not exist. Builds are
# manual for now (docker/README.md §1). To turn CI on: deploy
# docker/github-runner.compose.yml on Server A, add the repo secrets
# (docker/INFRA-CI.md), then restore the `push:` block below.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, carpetavenue-jp-build]
    env:
      IMAGE: registry.carpetavenue.net/carpetavenue-jp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.carpetavenue.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      # Repo root IS src/, so build context = "." and Dockerfile = docker/Dockerfile.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ github.run_number }}
          secrets: |
            composer_auth=${{ secrets.COMPOSER_AUTH }}
            env_php_scd=${{ secrets.ENV_PHP_SCD }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Trigger Dokploy deploy
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK }}"
          echo "Deployed: latest = v${{ github.run_number }}"
