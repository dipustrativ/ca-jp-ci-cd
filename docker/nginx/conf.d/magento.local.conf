# Local test = plain HTTP on :80. No TLS locally, so no certs to manage.
# In real prod, TLS is terminated at the edge (Traefik / Dokploy Domain tab,
# or your own proxy) — never inside this container. See docker/README.md.
server {
    listen 80;
    server_name localhost carpetavenue-jp.devs;

    # Resolve php-fpm via Docker DNS at request time (no static upstream, so
    # nginx starts even if the app container isn't up yet).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $fastcgi_backend "carpetavenue-jp-fpm:9000";

    client_max_body_size 100m;

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE production;

    include /etc/nginx/magento.conf;
}
