user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    client_max_body_size 64m;
    server_tokens off;

    # Website per domain. One line each: <hostname> "<store_website.code>";
    # Unlisted = base website. Path-based store views need nothing here.
    # Consumed by fastcgi_extra/multistore.conf. See docs/multistore.md.
    #
    # This install is single-website (store_website: ca_jp) with one store view
    # (`jp`), so every host resolves to the base website and the map is empty on
    # purpose. Add a line here only when a second website gets its own domain.
    map $http_host $MAGE_RUN_CODE {
        default  "";
    }
    map $MAGE_RUN_CODE $MAGE_RUN_TYPE {
        ""       "";
        default  "website";
    }

    include /etc/nginx/conf.d/*.conf;
}
