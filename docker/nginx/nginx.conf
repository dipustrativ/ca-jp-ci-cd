user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    client_max_body_size 64m;
    server_tokens off;

    # Traefik fronts us, so $remote_addr is Traefik's container IP for EVERY
    # request. Without this, the limit_conn zone below would be one shared bucket
    # and the first API client to fill it would 503 the whole storefront.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # One API client must never be able to occupy every php-fpm worker.
    # An ERP polling /rest/V1/orders every 10s, each call taking 12s, accumulates
    # overlapping requests until all children are held and the storefront queues
    # behind it. That is a CONCURRENCY problem, not a rate one: 11,861 calls over
    # two days is 0.068 r/s, under any rate limit worth setting. Cap connections
    # per client instead — see `location /rest/` in templates/.
    limit_conn_zone  $binary_remote_addr  zone=apiconn:10m;
    limit_conn_status 503;

    # Website per domain. One line each: <hostname> "<store_website.code>";
    # Unlisted = base website. Path-based store views need nothing here.
    # Consumed by fastcgi_extra/multistore.conf. See docs/multistore.md.
    #
    # This install is single-website (store_website: ca_jp) with one store view
    # (`jp`), so every host resolves to the base website and the map is empty on
    # purpose. Add a line here only when a second website gets its own domain.
    map $http_host $MAGE_RUN_CODE {
        default  "";
    }
    map $MAGE_RUN_CODE $MAGE_RUN_TYPE {
        ""       "";
        default  "website";
    }

    include /etc/nginx/conf.d/*.conf;
}
