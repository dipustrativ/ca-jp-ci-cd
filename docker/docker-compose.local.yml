# CarpetAvenue JP — local full-stack test of the production image flow.
# Uses the external registry (registry.carpetavenue.net) — run `docker login` first.
#
#   1. docker login registry.carpetavenue.net
#   2. Build & push image:
#        docker buildx build \
#          --secret id=composer_auth,src=auth.json \
#          --secret id=env_php_scd,src=docker/env.php.scd \
#          -f docker/Dockerfile \
#          -t registry.carpetavenue.net/carpetavenue-jp:local \
#          --push .
#   3. Start stack:
#        IMAGE_TAG=local docker compose -f docker/docker-compose.local.yml --env-file docker/.env.local up -d
#   4. Site: http://localhost | RabbitMQ UI: http://localhost:15672
#
# MySQL runs here as a container to mimic the external prod endpoint.

services:

  upgrade:
    image: registry.carpetavenue.net/carpetavenue-jp:${IMAGE_TAG:-local}
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/var &&
      php bin/magento maintenance:enable &&
      php -d memory_limit=2G bin/magento setup:upgrade --keep-generated &&
      php bin/magento maintenance:disable"
    restart: "no"
    depends_on:
      cache:  { condition: service_healthy }
      queue:  { condition: service_healthy }
      search: { condition: service_healthy }
    environment: &magento_env
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      VALKEY_HOST: ${VALKEY_HOST:-cache}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-queue}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-search}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      MAGE_CRYPT_KEY: ${MAGE_CRYPT_KEY}
      MAGE_GRAPHQL_ID_SALT: ${MAGE_GRAPHQL_ID_SALT}
      DOMAIN: ${DOMAIN:-carpetavenue-jp.devs}
    volumes:
      - magento_var:/var/www/html/var
    networks: ["carpetavenue_jp_net"]

  app:
    image: registry.carpetavenue.net/carpetavenue-jp:${IMAGE_TAG:-local}
    restart: unless-stopped
    mem_limit: 4g
    depends_on:
      upgrade: { condition: service_completed_successfully }
      queue:   { condition: service_healthy }
    environment: *magento_env
    volumes:
      - magento_media:/var/www/html/pub/media
      - magento_var:/var/www/html/var
    networks:
      carpetavenue_jp_net:
        aliases: ["carpetavenue-jp-fpm"]

  static:
    image: registry.carpetavenue.net/carpetavenue-jp:${IMAGE_TAG:-local}
    command: sh -c "rm -rf /mnt/static/* && cp -a /var/www/html/pub/static/. /mnt/static/"
    restart: "no"
    depends_on:
      upgrade: { condition: service_completed_successfully }
    volumes: ["magento_static:/mnt/static"]
    networks: ["carpetavenue_jp_net"]

  cron:
    image: registry.carpetavenue.net/carpetavenue-jp:${IMAGE_TAG:-local}
    command: cron -f
    restart: unless-stopped
    depends_on:
      upgrade: { condition: service_completed_successfully }
    environment: *magento_env
    volumes:
      - magento_media:/var/www/html/pub/media
      - magento_var:/var/www/html/var
    networks: ["carpetavenue_jp_net"]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on: ["app", "static"]
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/magento.local.conf:/etc/nginx/conf.d/default.conf:ro
      # ../nginx.conf, NOT nginx.conf.sample: the sample is the pristine Magento
      # skeleton file ("NOT USED" in its own header) and is missing the
      # fastcgi_extra include. Mounting it made the dry-run test a config the
      # image never ships. The wildcard include matching nothing here is fine.
      - ../nginx.conf:/etc/nginx/magento.conf:ro
      - magento_media:/var/www/html/pub/media:ro
      - magento_static:/var/www/html/pub/static:ro
    networks: ["carpetavenue_jp_net"]

  # MySQL 8.4 — OPTIONAL local stand-in. Off by default (you're using remote DB).
  # Start it explicitly with:  --profile localdb
  db:
    image: mysql:8.4
    profiles: ["localdb"]
    restart: unless-stopped
    mem_limit: 4g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --max_allowed_packet=64M --log_bin_trust_function_creators=1
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: ["carpetavenue_jp_net"]

  cache:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: valkey-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    volumes: ["valkey_data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: ["carpetavenue_jp_net"]

  queue:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports: ["15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: ["carpetavenue_jp_net"]

  search:
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    mem_limit: 1500m
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes: ["opensearch_data:/usr/share/opensearch/data"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: ["carpetavenue_jp_net"]

volumes:
  mysql_data:
  valkey_data:
  rabbitmq_data:
  opensearch_data:
  magento_media:
  magento_var:
  magento_static:

networks:
  carpetavenue_jp_net:
    driver: bridge
