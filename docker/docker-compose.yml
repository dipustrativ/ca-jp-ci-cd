# CarpetAvenue JP — "normal" server production (plain Docker host, NO Dokploy).
#
# Same pulled images as the Dokploy file, but nginx PUBLISHES port 80 on the
# host instead of hiding behind Traefik. Put TLS at the edge (Caddy, a host
# nginx/Traefik, or Cloudflare) pointing at http://<host>:80 — this stack
# speaks plain HTTP, exactly like the Dokploy path where Traefik does the TLS.
#
#   cp docker/.env.production.example docker/.env   # fill real values
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d
#
# External MySQL reached by DB_HOST (IP:port) in the env file.
# Host once: sysctl -w vm.max_map_count=262144   (OpenSearch; persist in sysctl.conf)

services:

  cache:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save ""
      ${VALKEY_PASSWORD:+--requirepass ${VALKEY_PASSWORD}}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [magento_net]

  queue:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [magento_net]

  search:
    image: opensearchproject/opensearch:3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [magento_net]

  # Runs setup:upgrade once per deploy, then exits.
  upgrade:
    image: ${REGISTRY_HOST:-registry.carpetavenue.net}/carpetavenue-jp:${IMAGE_TAG:-latest}
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/var &&
      php bin/magento maintenance:enable &&
      php -d memory_limit=2G bin/magento setup:upgrade --keep-generated &&
      php bin/magento maintenance:disable"
    restart: "no"
    depends_on:
      cache:  { condition: service_healthy }
      queue:  { condition: service_healthy }
      search: { condition: service_healthy }
    environment: &magento_env
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      VALKEY_HOST: ${VALKEY_HOST:-cache}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-queue}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-search}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      MAGE_CRYPT_KEY: ${MAGE_CRYPT_KEY}
      MAGE_GRAPHQL_ID_SALT: ${MAGE_GRAPHQL_ID_SALT}
      DOMAIN: ${DOMAIN:-playground.carpetavenue.jp}
      DEBUG_ENV: ${DEBUG_ENV:-false}
    volumes:
      - magento_var:/var/www/html/var
    networks: [magento_net]

  app:
    image: ${REGISTRY_HOST:-registry.carpetavenue.net}/carpetavenue-jp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Same uid as php-fpm workers, so a bare `docker exec` (bin/magento,
    # catalog:images:resize) runs as www-data and can never leave root-owned
    # dirs in pub/media or var. Entrypoint skips its root-only steps.
    user: www-data
    depends_on:
      upgrade: { condition: service_completed_successfully }
      queue:   { condition: service_healthy }
      search:  { condition: service_healthy }
    environment: *magento_env
    volumes:
      - magento_media:/var/www/html/pub/media
      - magento_var:/var/www/html/var
    networks:
      magento_net:
        aliases: [carpetavenue-jp-fpm]

  static:
    image: ${REGISTRY_HOST:-registry.carpetavenue.net}/carpetavenue-jp:${IMAGE_TAG:-latest}
    command: sh -c "rm -rf /mnt/static/* && cp -a /var/www/html/pub/static/. /mnt/static/"
    restart: "no"
    depends_on:
      upgrade: { condition: service_completed_successfully }
    volumes:
      - magento_static:/mnt/static
    networks: [magento_net]

  cron:
    image: ${REGISTRY_HOST:-registry.carpetavenue.net}/carpetavenue-jp:${IMAGE_TAG:-latest}
    command: cron -f
    restart: unless-stopped
    depends_on:
      upgrade: { condition: service_completed_successfully }
    environment: *magento_env
    volumes:
      - magento_media:/var/www/html/pub/media
      - magento_var:/var/www/html/var
    networks: [magento_net]

  # Baked-config nginx. Publishes :80 on the host — put your TLS proxy in front.
  nginx:
    image: ${REGISTRY_HOST:-registry.carpetavenue.net}/carpetavenue-jp-nginx:${NGINX_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
      - static
    # Co-hosted with carpient? Only one stack can hold host :80 on Path A —
    # set HTTP_PORT to something else for this one (or use Path B, where Traefik
    # routes by domain and nothing is published).
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - magento_media:/var/www/html/pub/media:ro
      - magento_static:/var/www/html/pub/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health_check.php || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [magento_net]

volumes:
  magento_media:
  magento_var:
  magento_static:
  valkey_data:
  rabbitmq_data:
  opensearch_data:

networks:
  magento_net:
    driver: bridge
