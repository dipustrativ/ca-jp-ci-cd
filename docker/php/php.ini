[PHP]
; Without this, error_reporting defaults to E_ALL (incl. E_DEPRECATED).
; Magento\Framework\App\ErrorHandler ANDs incoming errors with error_reporting()
; and throws when non-zero — so any PHP 8.1+ deprecation notice in vendor/
; code (e.g. ScopeCodeResolver.php null array offset) becomes a fatal,
; request-killing exception instead of a logged notice.
error_reporting          = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 2G is Adobe's documented production value. It is a per-request CEILING, not
; typical usage — size pm.max_children in www.conf to host RAM accordingly.
memory_limit            = 2048M
max_execution_time      = 300
max_input_time          = 90
max_input_vars          = 75000
upload_max_filesize     = 64M
post_max_size           = 64M
date.timezone           = UTC
; Off: nginx already does gzip (docker/nginx/nginx.conf). Double-compressing
; every FPC hit burns CPU for nothing.
zlib.output_compression = Off

; Realpath cache — critical for Magento's deep file tree
realpath_cache_size     = 10M
realpath_cache_ttl      = 86400

; PHP-level FALLBACK only. Magento's own session handler wins: env.php.template
; sets session.save='redis' with session.redis.host = VALKEY_SESSION_HOST (the
; separate `sessions` container on Path B). This path is what a non-Magento
; script — or Magento failing to build its handler — would land on, and it
; points at the CACHE instance, whose allkeys-lru will evict live carts. php.ini
; cannot read env vars, so it cannot follow VALKEY_SESSION_HOST; if you ever see
; sessions in db2 of `cache`, that is this line, not env.php.
session.save_handler    = redis
session.save_path       = "tcp://cache:6379?database=2"

[opcache]
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files   = 100000
opcache.validate_timestamps     = 0
opcache.revalidate_freq         = 0
opcache.consistency_checks      = 0
opcache.save_comments           = 1
; JIT intentionally OFF: Magento is I/O + DB/cache bound, not CPU bound.
; Adobe does not recommend JIT for Magento — negligible gain, added risk,
; and it would reserve 128M for nothing. OpCache (above) is the real win.
opcache.jit                     = disable
opcache.jit_buffer_size         = 0
