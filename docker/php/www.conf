[www]
user  = www-data
group = www-data

; TCP so nginx reaches FPM across containers
listen = 9000

; Dynamic process manager
;
; max_children is capped by CPU here, not RAM. Host is 31.3G / 8 cores, shared
; with carpient — RAM left ~12G free while load hit 64, so the old "8GB host,
; 3.9G / 200M = 20" memory derivation is not the binding constraint any more.
;
;   CPU-bound PHP: 2-4x cores = 16-32 children TOTAL across every pool on the box
;   carpient is 20 (CARPIENT/src/docker/php/www.conf) + this 16 = 36, i.e. 4.5x.
;
; 36 is only safe while requests are short — oversubscription costs nothing when
; workers idle, and everything when they all run at once. If /rest/V1/orders is
; still taking 12s, raising this buys nothing: it yields 16 slow requests instead
; of 8. Fix latency first, then this.
;
; 16 x ~200M = ~3.2G, comfortable in the free 12G. Baked into the image — rebuild.
pm = dynamic
pm.max_children      = 16
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers to bound memory leaks
pm.max_requests      = 1000

; Log slow requests (>10s) to stderr — captured by `docker logs`
slowlog                 = /proc/self/fd/2
request_slowlog_timeout = 10s

; The ONLY bound that actually frees a worker. Default is 0 — unlimited — which
; is how a slow /rest/V1/orders poll held every child indefinitely and took the
; storefront down with it. The other two look like limits and are not:
;   php.ini max_execution_time=300  excludes time spent OUTSIDE the script, so a
;                                   request blocked in a MySQL query sails past it
;   fastcgi_read_timeout=600s       nginx 504s the client; the child keeps running
; fpm SIGTERMs the child, so this one works regardless of what PHP is stuck in.
;
; 330 = max_execution_time + 30. PHP hits its own limit first and logs a stack
; trace; this is the backstop for when it cannot self-interrupt. Keep it ABOVE
; max_execution_time or admin imports and Syncer bulk-PDF calls die without one.
; Pool-wide — it cannot be scoped per URL, which is why /rest/ is capped by
; limit_conn in nginx instead.
request_terminate_timeout = 330s

; Expose env vars to PHP (getenv() in env.php)
clear_env = no
