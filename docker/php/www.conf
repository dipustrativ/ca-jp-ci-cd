[www]
user  = www-data
group = www-data

; TCP so nginx reaches FPM across containers
listen = 9000

; Dynamic process manager
;
; max_children is a MEMORY ceiling, not a throughput dial — FPM will fork all of
; them and let the kernel OOM-kill the container. php-fpm's share of the 8GB host
; budget (see the `cache` service in docker-compose.dokploy.yml) is ~3.9G:
;
;   3.9G / ~200M average Magento worker RSS ~= 20 children
;
; The old 50 was ~10G on an 8GB box. Re-derive from that line if host RAM changes.
pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers to bound memory leaks
pm.max_requests      = 1000

; Log slow requests (>10s) to stderr — captured by `docker logs`
slowlog                 = /proc/self/fd/2
request_slowlog_timeout = 10s

; Expose env vars to PHP (getenv() in env.php)
clear_env = no
